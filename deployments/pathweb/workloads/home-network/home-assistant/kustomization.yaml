---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: homeassistant/home-assistant
  newName: ghcr.io/home-assistant/home-assistant
  newTag: "2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f"
- name: ghcr.io/matter-js/matterjs-server
  newTag: "1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e"
- name: alpine
  newTag: "3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6"
resources:
- deployment.yaml
- service.yaml
- persistentvolumeclaim.yaml
- networkattachmentdefinition.yaml
- httproute.yaml
- ciliumnetworkpolicy.yaml
- backup-credentials.sealed.yaml
- hass-secrets.sealed.yaml
patches: []
configMapGenerator:
- name: homeassistant-docker-venv
  files:
  - venv-run
  - leader-locker.sh
  - matter-server.sh
  - ha-probe.sh
  - sync-http-settings.py
- name: ha-config-extra
  files:
  - ha-http-config.yaml
  - hass-ingress.yaml
labels:
- pairs:
    app.kubernetes.io/version: 2026.4.2
  includeTemplates: true
  includeSelectors: false
