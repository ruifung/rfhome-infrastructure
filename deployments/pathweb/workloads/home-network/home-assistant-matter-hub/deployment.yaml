---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-matter-hub
  namespace: home-network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-matter-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-matter-hub
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"hamh-iot-network"}]'
    spec:
      priorityClassName: rfhome-home-critical
      nodeSelector:
        kubernetes.io/os: linux
        location: rfhome
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-group
                operator: In
                values: [baldric, voyager]
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: home-assistant-matter-hub
        image: ghcr.io/riddix/home-assistant-matter-hub:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: TZ
          value: Asia/Kuala_Lumpur
        - name: HAMH_HOME_ASSISTANT_URL
          value: http://home-assistant:8123
        - name: HAMH_MDNS_NETWORK_INTERFACE
          value: net1
        - name: HAMH_HTTP_PORT
          value: "8482"
        envFrom:
        - secretRef:
            name: hamh-secrets
        ports:
        - containerPort: 8482
          name: http
          protocol: TCP
        volumeMounts:
        - name: hamh-data
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 8482
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8482
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
      - name: hamh-data
        persistentVolumeClaim:
          claimName: home-assistant-matter-hub-data
